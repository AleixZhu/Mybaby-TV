name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          else
            echo "sdkmanager not found; relying on Gradle auto-download (licenses preaccepted on runner)"
          fi
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "gradlew not found, generating wrapper..."
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List APK outputs
        run: |
          echo "=== Debug APKs ==="
          find app/build/outputs/apk/debug -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "No debug APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsTvGuard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to Release (fixed download link)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "No debug APK found"; exit 1; fi
          DEST="/tmp/公主答题可看.apk"
          cp "$APK" "$DEST"
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest \
            "$DEST" \
            --title "公主答题可看 (auto-build)" \
            --notes "Auto-built debug APK from ${{ github.sha }}" \
            --prerelease
          echo "Download: https://github.com/${{ github.repository }}/releases/download/apk-latest/%E5%85%AC%E4%B8%BB%E7%AD%94%E9%A2%98%E5%8F%AF%E7%9C%8B.apk"
