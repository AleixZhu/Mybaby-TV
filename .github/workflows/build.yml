name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "gradlew not found, generating wrapper..."
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon || echo "Release build skipped or failed"

      - name: List APK outputs
        run: |
          echo "=== Debug APKs ==="
          find app/build/outputs/apk/debug -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "No debug APK"
          echo "=== Release APKs ==="
          find app/build/outputs/apk/release -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "No release APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KidsTvGuard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK (if exists)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KidsTvGuard-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload mapping (if minify enabled)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KidsTvGuard-mapping
          path: app/build/outputs/mapping/
          if-no-files-found: ignore
          retention-days: 30
