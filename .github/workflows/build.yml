name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          else
            echo "sdkmanager not found; relying on Gradle auto-download (licenses preaccepted on runner)"
          fi
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "gradlew not found, generating wrapper..."
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew
          fi

      - name: Compute version (versionCode = GitHub run number)
        id: ver
        run: |
          VC=${{ github.run_number }}
          VN="1.0.${VC}"
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VC versionName=$VN"

      - name: Verify signing keystore is readable
        run: |
          if [ ! -f signing/release.p12 ]; then echo "signing/release.p12 missing"; exit 1; fi
          keytool -list -keystore signing/release.p12 -storetype PKCS12 -storepass kidstvguard
          echo "keystore OK"

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace -Pvc=${{ steps.ver.outputs.vc }} -Pvn=${{ steps.ver.outputs.vn }}

      - name: Prepare release assets (APK + version.json)
        run: |
          set -e
          REL=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -1)
          if [ -z "$REL" ]; then echo "No signed release APK found"; exit 1; fi
          cp "$REL" /tmp/GongZhuDaTiKeKan.apk
          VC="${{ steps.ver.outputs.vc }}"
          VN="${{ steps.ver.outputs.vn }}"
          CHANGELOG=$(git log -1 --pretty=%s | sed 's/\\/\\\\/g; s/"/\\"/g')
          APK_URL="https://github.com/${{ github.repository }}/releases/download/apk-latest/GongZhuDaTiKeKan.apk"
          printf '{\n  "versionCode": %s,\n  "versionName": "%s",\n  "apkUrl": "%s",\n  "changelog": "%s",\n  "forceUpdate": false,\n  "updatedAt": "%s"\n}\n' "$VC" "$VN" "$APK_URL" "$CHANGELOG" "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" > /tmp/version.json
          echo "=== version.json ==="
          cat /tmp/version.json
          echo "=== apk ==="
          ls -lh /tmp/GongZhuDaTiKeKan.apk

      - name: Upload APK artifact (含中文文件名)
        uses: actions/upload-artifact@v4
        with:
          name: KidsTvGuard-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Release (固定下载链接 + 自动更新源)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest \
            /tmp/GongZhuDaTiKeKan.apk \
            /tmp/version.json \
            --title "公主答题可看 (auto-build)" \
            --notes "签名 release APK + 自动更新源 version.json（versionCode=${{ steps.ver.outputs.vc }}）。电视端打开 APP 会自动比对版本并提示更新。" \
            --prerelease
          echo "APK : https://github.com/${{ github.repository }}/releases/download/apk-latest/GongZhuDaTiKeKan.apk"
          echo "Feed: https://github.com/${{ github.repository }}/releases/download/apk-latest/version.json"
